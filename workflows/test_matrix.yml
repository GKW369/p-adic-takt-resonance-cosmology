name: pTRC Core Invariance & AGPLv3 Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compliance_audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Baseline
      uses: actions/checkout@v4

    - name: Initialize Pure Hardware Environment (Python 3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Discrete Computing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python

    - name: Run Core First-Principles Orchestrator
      run: |
        python src/00_ptrc_first_principles_engine.py

    - name: Audit Static Code-Hygiene (Zero-Float-Rule)
      run: |
        echo "======================================================================"
        echo "   STARTING STATIC ANALYSIS LAYER: TESTING FOR ANALOG LEAKAGE FIELDS"
        echo "======================================================================"
        if grep -r --include="*.py" -E "\bfloat\b|\b[0-9]+\.[0-9]+\b" src/ experimental/; then
          echo " -> [ CRITICAL ERROR ] Analog Leakage detected! Banned float fields found in RAM mapping."
          exit 1
        fi
        if grep -r --include="*.py" -E "[a-zA-Z0-9_)]\s*/\s*[a-zA-Z0-9_]" src/ experimental/; then
          echo " -> [ CRITICAL ERROR ] Analog Division Exploit! Double-slash (//) floor division required."
          exit 1
        fi
        echo "STATUS: 100% Floating-Point-Free Invariance Confirmed."

    - name: Audit Symmetrical License-Headers (AGPLv3 Coherence)
      run: |
        echo "======================================================================"
        echo "   STARTING LEGAL ANALYSIS LAYER: TESTING FOR LICENSE COHERENCE"
        echo "======================================================================"
        if ! grep -r --include="*.py" "https://gnu.org" src/ experimental/; then
          echo " -> [ LICENSE CONFLICT ] Missing or unverified AGPLv3 deep-link compliance header!"
          exit 1
        fi
        echo "STATUS: AGPLv3 Symmetrical Headers verified across all core nodes."

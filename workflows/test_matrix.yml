name: pTRC Framework Automated Validation Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate_integer_lattice:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Layer
      uses: actions/checkout@v4

    - name: Initialize Pure Hardware Environment (Python 3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Discrete Computing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: Execute Verification Matrix
      run: |
        python src/00_ptrc_first_principles_engine.py
        python src/fluid_resonance.py
        python src/kreis_resonance.py
        python src/prime_lattice_determinism.py

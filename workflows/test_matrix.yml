name: pTRC Discrete Integer Physics, AI & Crypto Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  c11-bare-metal-and-crypto-parity:
    name: C11 Bare-Metal Build & AI/Crypto Bit-Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure & Build C11 Engines (Zero-Malloc, -Wall -Wextra -Wpedantic)
        run: |
          cmake -B build -S .
          cmake --build build --config Release

      - name: Run C11 Bare-Metal Crypto v4.0 Self-Test
        run: ./build/ptrc_crypt_demo

      - name: Run C11 Bare-Metal BitNet AI v2.0 Self-Test
        run: ./build/00_ptrc_bitnet_demo

      - name: Verify C11 <-> Python Crypto v4.0 Bit-Parity & Metrics
        run: |
          PYTHONPATH=src python3 src/00_test_ptrc_crypt_parity.py
          PYTHONPATH=src python3 src/00_test_ptrc_crypt_metrics.py

      - name: Verify C11 <-> Python BitNet AI v2.0 Bit-Parity & Metrics
        run: |
          PYTHONPATH=src python3 src/test_ptrc_bitnet.py
          PYTHONPATH=src python3 src/00_test_ptrc_bitnet_metrics.py

  python-physics-audit:
    name: Discrete Integer Physics Audit (Python 3.10 - 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Integer Core & No-Zero Invariants
        run: |
          python3 -m py_compile src/*.py
          if [ -f src/test_ptrc.py ]; then PYTHONPATH=src python3 src/test_ptrc.py; fi
          if [ -f src/test_ptrc_metrics.py ]; then PYTHONPATH=src python3 src/test_ptrc_metrics.py; fi
          PYTHONPATH=src python3 src/00_test_ptrc_crypt_parity.py
          PYTHONPATH=src python3 src/test_ptrc_bitnet.py

  zero-float-gate:
    name: Strict Zero-Float & Zero-Trigonometry Gate (C11 & Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit C11 & Engine Files for Forbidden Float/Trig Tokens
        run: |
          python3 - << 'EOF'
          import pathlib, re, sys
          files = [
              pathlib.Path("embedded/crypto/ptrc_crystal.h"),
              pathlib.Path("embedded/crypto/ptrc_crystal.c"),
              pathlib.Path("embedded/crypto/ptrc_crypt_demo.c"),
              pathlib.Path("embedded/ai/ptrc_bitnet_engine.h"),
              pathlib.Path("embedded/ai/ptrc_bitnet_engine.c"),
              pathlib.Path("src/00_ptrc_bitnet_demo.c"),
              pathlib.Path("src/ptrc_crystal_aead.py"),
              pathlib.Path("src/ptrc_bitnet_engine.py"),
          ]
          forbidden = re.compile(r"\b(float|double|sin|cos|tan|sqrt|pow|log|exp)\b")
          failed = False
          for f in files:
              if not f.exists():
                  continue
              text = re.sub(r"/\*.*?\*/", "", f.read_text(encoding="utf-8"), flags=re.S)
              text = re.sub(r'""".*?"""', "", text, flags=re.S)
              text = re.sub(r"'''.*?'''", "", text, flags=re.S)
              text = re.sub(r"//.*", "", text)
              text = re.sub(r"#.*", "", text)
              for lineno, line in enumerate(text.splitlines(), 1):
                  m = forbidden.search(line)
                  if m:
                      print(f"ERROR: Forbidden token '{m.group(0)}' in {f}:{lineno}")
                      failed = True
          if failed:
              sys.exit(1)
          print("PASS: Zero-float & zero-trigonometry invariant verified across C11 & Python engines.")
          EOF

  docs-consistency:
    name: Documentation & Citation Metadata Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Citation, License & Key Documentation Files
        run: |
          test -f LICENSE
          test -f CITATION.cff
          test -f README.md
          test -f ARCHITECTURE.md
          test -f SECURITY.md
